[build]
  command = "npm run build"
  publish = "src"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."reset-program-availability"]
  schedule = "15 7 * * *"

# Serve the existing site under /uma without changing its root deployment.
# The splat rewrite maps nested pages and relative assets back to their
# existing publish paths; Netlify Functions remain at /.netlify/functions/*.
[[redirects]]
  from = "/uma"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/uma/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/uma/*"
  to = "/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
